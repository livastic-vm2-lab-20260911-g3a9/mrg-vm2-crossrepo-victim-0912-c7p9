name: VM2 secret-context probe
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  issues: write
jobs:
  canary:
    if: ${{ secrets.VM2_QUEUE_SECRET_CANARY == 'VM2_SECRET_CANARY_0912' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create non-secret marker issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body=json.dumps({'title':f"VM2_SECRET_CONTEXT_MARKER_PR_{os.environ['PR_NUMBER']}",'body':'Disposable VM2 canary: repository secret was available to this workflow run. No secret value is included.'}).encode()
          req=urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPO']}/issues",data=body,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2026-03-10'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              print('marker_status',r.status)
          PY
