name: VM2 Queue Secret Probe
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
  issues: write
jobs:
  secret-canary:
    if: github.event.pull_request.title == 'VM2_QUEUE_SECRET_TRIGGER'
    runs-on: ubuntu-latest
    env:
      VM2_QUEUE_SECRET_CANARY: ${{ secrets.VM2_QUEUE_SECRET_CANARY }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Verify canary and create marker issue
        shell: bash
        run: |
          set -euo pipefail
          test "$VM2_QUEUE_SECRET_CANARY" = "VM2_CANARY_PRESENT_0912"
          python3 - <<'PY'
          import json, os, urllib.request
          title = f"VM2_QUEUE_SECRET_MARKER_pr-{os.environ['PR_NUMBER']}_run-{os.environ['RUN_ID']}"
          data = json.dumps({"title": title, "body": "Controlled marker: disposable canary secret was available to this pull_request workflow."}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues",
              data=data,
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2026-03-10"},
              method="POST",
          )
          with urllib.request.urlopen(req) as r:
              print("marker_issue_status=", r.status)
          PY
